<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 검토</title><link rel="stylesheet" href="/static/studio.css"></head><body class="center-page"><section class="panel review-panel"><span class="eyebrow">TECH SHORTS / REVIEW</span><h1>영상 검토</h1><video controls playsinline src="{{ url_for('review_video', token=token) }}"></video><p class="script-copy">{{ job.script }}</p>{% if job.status == 'pending_approval' %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><div class="actions"><button name="action" value="approve" class="primary">승인</button><button name="action" value="reject" class="secondary">거부</button></div></form>{% else %}<p>검토가 처리되었습니다: {{ job.status }}</p>{% endif %}<p class="muted">승인 후 Studio에서 게시할 플랫폼을 선택하세요. 거부된 결과 파일도 보관됩니다.</p></section></body></html>
